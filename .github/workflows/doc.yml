name: docs
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
env:
  ECLIPSED_VERSION: v0.2.0
  ECLIPSED_REPO: umbreon-boop/eclipsed
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ECLIPSED_VERSION" -R "$ECLIPSED_REPO" -D eclipsed \
            -p "libeclipsed-x86_64-unknown-linux-gnu.so" -p "eclipsed.h"
          echo "ECL_LIB=$PWD/eclipsed/libeclipsed-x86_64-unknown-linux-gnu.so" >> "$GITHUB_ENV"
          echo "ECL_H=$PWD/eclipsed/eclipsed.h" >> "$GITHUB_ENV"
      - run: mise run doc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v5
