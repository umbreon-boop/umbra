name: Build and Release
on:
  push:
    tags: ['v*']
env:
  CARGO_TERM_COLOR: always
  ECLIPSED_VERSION: v0.2.0
  ECLIPSED_REPO: umbreon-boop/eclipsed
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Building parses with Eclipsed, so the build host needs its library.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ECLIPSED_VERSION" -R "$ECLIPSED_REPO" -D eclipsed \
            -p "libeclipsed-x86_64-unknown-linux-gnu.so" -p "eclipsed.h"
          echo "ECL_LIB=$PWD/eclipsed/libeclipsed-x86_64-unknown-linux-gnu.so" >> "$GITHUB_ENV"
          echo "ECL_H=$PWD/eclipsed/eclipsed.h" >> "$GITHUB_ENV"
      - run: |
          luajit ./src/main.lua build
          sed -i '1i #!/usr/bin/env luajit' target/artifact.lua
      - uses: actions/upload-artifact@v7
        with:
          name: umbra-build
          path: target/artifact.lua
  package:
    needs: build
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            ext: so
          - target: x86_64-unknown-linux-musl
            ext: so
          - target: aarch64-unknown-linux-gnu
            ext: so
          - target: aarch64-unknown-linux-musl
            ext: so
          - target: aarch64-apple-darwin
            ext: dylib
          - target: aarch64-linux-android
            ext: so
          - target: x86_64-linux-android
            ext: so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: umbra-build
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ECLIPSED_VERSION" \
            -R "$ECLIPSED_REPO" \
            -p "libeclipsed-${{ matrix.target }}.${{ matrix.ext }}" \
            -p "eclipsed.h"
      - run: |
          mkdir -p "dist/umbra-${{ matrix.target }}"
          # The artifact holds only `artifact.lua`, downloaded to the working
          # directory.
          cp artifact.lua "dist/umbra-${{ matrix.target }}/umbra"
          if [[ "${{ matrix.target }}" == *"-android" ]]; then
            sed -i '1s|^#!/usr/bin/env|#!/data/data/com.termux/files/usr/bin/env|' "dist/umbra-${{ matrix.target }}/umbra"
          fi
          chmod +x "dist/umbra-${{ matrix.target }}/umbra"
          cp "libeclipsed-${{ matrix.target }}.${{ matrix.ext }}" \
            "dist/umbra-${{ matrix.target }}/libeclipsed.${{ matrix.ext }}"
          cp eclipsed.h "dist/umbra-${{ matrix.target }}/"
          tar czf "dist/umbra-${{ matrix.target }}.tar.gz" -C dist "umbra-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: umbra-${{ matrix.target }}
          path: dist/*.tar.gz
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*.tar.gz
      - uses: jdx/packslip@v1
        with:
          artifacts: dist/*.tar.gz
          bin: umbra
          require: |
            bin:luajit
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
  doc:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run doc.yml --ref main -R "$GITHUB_REPOSITORY"
